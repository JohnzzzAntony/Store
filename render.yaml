services:
  - type: web
    name: django-ecommerce
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecommerce.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: ecommerce-db
    plan: free
