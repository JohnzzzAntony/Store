<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Playfair Display', serif; color: #1a3535; }
        .container { max-width: 600px; margin: 0 auto; background-color: #fdfdfb; padding: 40px; }
        .header { text-align: center; border-bottom: 2px solid #2d5a5a; padding-bottom: 20px; }
        .logo { font-size: 28px; font-weight: 700; color: #2d5a5a; }
        .order-info { margin-top: 30px; font-size: 16px; }
        .delivered-box { padding: 40px; border: 2px solid #28a745; border-radius: 8px; font-size: 18px; margin-top: 20px; text-align: center; color: #28a745; }
        .footer { margin-top: 50px; text-align: center; font-size: 12px; color: #777; border-top: 1px solid #eeeeee; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">LUXURY PERFUMES</div>
        <h3>Order Delivered!</h3>
    </div>
    
    <div class="order-info">
        <p>Hello {{ order.customer.name }},</p>
        <p>Success! Your order #<strong>{{ order.id }}</strong> has been delivered.</p>
    </div>
    
    <div class="delivered-box">
        Successfully Delivered. We hope you enjoy your new fragrance!
    </div>
    
    <div class="footer">
        <p>Love your purchase? Tag us on social media!</p>
        <p>&copy; 2026 {{ store_name }}. All Rights Reserved.</p>
    </div>
</div>
</body>
</html>
