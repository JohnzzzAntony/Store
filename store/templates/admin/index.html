{% extends "admin/index.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
    #content {
        background: #f8f9fa;
    }
    .dashboard-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .stat-card {
        padding: 20px;
        border-radius: 12px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .stat-card.blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .stat-card.green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .stat-card.purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    
    .stat-value { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
    .stat-label { font-size: 1rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }

    #admin-charts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    .chart-box {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
</style>
{% endblock %}

{% block content %}

<div id="content-main">
    <div class="dashboard-container">
        <div class="stat-card blue">
            <div class="stat-label">Live Visitors</div>
            <div class="stat-value" id="live-visitors">0</div>
        </div>
        <div class="stat-card green">
            <div class="stat-label">Daily Revenue</div>
            <div class="stat-value" id="daily-revenue">$0</div>
        </div>
        <div class="stat-card purple">
            <div class="stat-label">New Orders</div>
            <div class="stat-value" id="new-orders">0</div>
        </div>
    </div>

    <div id="admin-charts">
        <div class="chart-box">
            <h3>Sales Analytics</h3>
            <canvas id="salesChart"></canvas>
        </div>
        <div class="chart-box">
            <h3>Top Categories</h3>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

    {{ block.super }}
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Sales Chart
        const ctxSales = document.getElementById('salesChart').getContext('2d');
        new Chart(ctxSales, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Revenue',
                    data: [1200, 1900, 3000, 2500, 2200, 3000, 4500],
                    borderColor: '#4facfe',
                    fill: false,
                    tension: 0.4
                }]
            },
            options: { responsive: true }
        });

        // Category Chart
        const ctxCat = document.getElementById('categoryChart').getContext('2d');
        new Chart(ctxCat, {
            type: 'doughnut',
            data: {
                labels: ['Men', 'Women', 'Unisex'],
                datasets: [{
                    data: [45, 35, 20],
                    backgroundColor: ['#4facfe', '#43e97b', '#764ba2']
                }]
            },
            options: { responsive: true }
        });

        // Simulate some live data
        setInterval(() => {
            const visitors = Math.floor(Math.random() * 50) + 10;
            document.getElementById('live-visitors').innerText = visitors;
        }, 5000);
    });
</script>

{% endblock %}
